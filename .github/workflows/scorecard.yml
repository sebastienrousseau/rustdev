# OpenSSF Scorecard (langdev core repo — mirrors templates/github-workflows/scorecard.yml).
# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Scores the repository against the public OpenSSF Scorecard rubric
# (branch protection, dependency pinning, token permissions, SAST,
# signed releases, …). Results are published to the public Scorecard
# API and uploaded to the repo's code-scanning tab; the README badge
# points at the live score.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '0 4 * * 1'  # Weekly, Monday 04:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege default: read-all. The analysis job escalates locally.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to code-scanning
      id-token: write          # publish results + sign the Scorecard badge
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 7

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
