# Static analysis (langdev core repo — mirrors templates/github-workflows/sast.yml).
# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# CodeQL has no shell or Dockerfile analyzer, so there is deliberately NO
# CodeQL job here (a no-op one would only add noise). This project's SAST is:
#   * ShellCheck   — static analysis of every shell script (→ SARIF)
#   * Trivy config — Dockerfile/compose/IaC misconfiguration scan (→ SARIF)
#   * Checkov      — Dockerfile + secrets policy scan (→ SARIF)
# All three publish SARIF to the code-scanning tab, which is the evidence the
# OpenSSF Scorecard "SAST" check looks for. See doc/CII-BEST-PRACTICES.md.
name: sast

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * 1'  # Weekly, Monday 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── ShellCheck → SARIF ─────────────────────────────────────────────
  shellcheck:
    name: ShellCheck (SARIF)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install shellcheck + jq
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: Run shellcheck and emit SARIF
        run: |
          set -euo pipefail
          files=$(git ls-files '*.sh' 'bin/langdev-sync' 'test/helpers/bin/*' 'test/helpers/common.bash')
          # json1 → SARIF 2.1.0. `|| true`: a finding is a non-zero exit, but
          # we still want to publish the report rather than abort here.
          shellcheck -x -f json1 $files > sc.json || true
          jq '{
            version: "2.1.0",
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            runs: [{
              tool: { driver: {
                name: "ShellCheck",
                informationUri: "https://www.shellcheck.net",
                rules: []
              }},
              results: [ .comments[] | {
                ruleId: ("SC" + (.code|tostring)),
                level: (if .level == "error" then "error"
                        elif .level == "warning" then "warning"
                        else "note" end),
                message: { text: .message },
                locations: [{ physicalLocation: {
                  artifactLocation: { uri: .file },
                  region: { startLine: .line, startColumn: .column }
                }}]
              } ]
            }]
          }' sc.json > shellcheck.sarif
      - name: Upload ShellCheck SARIF
        uses: github/codeql-action/upload-sarif@2d92b76c45b91eb80fc44c74ce3fce0ee94e8f9d # v3.30.0
        with:
          sarif_file: shellcheck.sarif
          category: shellcheck

  # ── Trivy config (Dockerfile / IaC misconfig) → SARIF ──────────────
  trivy-config:
    name: Trivy config (SARIF)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Install Trivy directly (the trivy-action's bundled installer has proven
      # flaky on the hosted runners). GITHUB_TOKEN authenticates the release
      # lookup so the install is not anonymously rate-limited.
      - name: Install Trivy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.65.0/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin v0.65.0
          trivy --version
      - name: Trivy misconfiguration scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRIVY_DISABLE_VEX_NOTICE: "true"
        run: |
          set -euo pipefail
          # exit-code 0: advisory — findings are published to code-scanning.
          trivy config . --format sarif --output trivy-config.sarif --exit-code 0
          ls -l trivy-config.sarif
      - name: Upload Trivy SARIF
        if: ${{ hashFiles('trivy-config.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2d92b76c45b91eb80fc44c74ce3fce0ee94e8f9d # v3.30.0
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  # ── Checkov (Dockerfile + secrets policy) → SARIF ──────────────────
  checkov:
    name: Checkov (SARIF)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Run Checkov via pip (pipx is preinstalled on the runner). The
      # checkov-action's output path handling did not emit results.sarif at the
      # repo root; running the CLI directly and locating the SARIF is reliable.
      - name: Checkov scan
        run: |
          set -euo pipefail
          pipx install checkov
          # --soft-fail: findings are advisory and published to code-scanning.
          checkov -d . --framework dockerfile,secrets \
            --output sarif --output-file-path checkov-out --soft-fail || true
          sarif="$(find checkov-out -type f -name '*.sarif' 2>/dev/null | head -n1 || true)"
          if [ -n "${sarif:-}" ]; then
            cp "$sarif" checkov.sarif
            ls -l checkov.sarif
          else
            echo "warning: checkov produced no SARIF" >&2
          fi
      - name: Upload Checkov SARIF
        if: ${{ hashFiles('checkov.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2d92b76c45b91eb80fc44c74ce3fce0ee94e8f9d # v3.30.0
        with:
          sarif_file: checkov.sarif
          category: checkov
