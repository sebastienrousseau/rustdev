# Static analysis (langdev core repo — mirrors templates/github-workflows/sast.yml).
# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# CodeQL has no shell or Dockerfile analyzer, so there is deliberately NO
# CodeQL job here (a no-op one would only add noise). This project's SAST is:
#   * ShellCheck   — static analysis of every shell script (→ SARIF)
#   * Trivy config — Dockerfile/compose/IaC misconfiguration scan (→ SARIF)
#   * Checkov      — Dockerfile + secrets policy scan (→ SARIF)
# All three publish SARIF to the code-scanning tab, which is the evidence the
# OpenSSF Scorecard "SAST" check looks for. See doc/CII-BEST-PRACTICES.md.
name: sast

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * 1'  # Weekly, Monday 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── ShellCheck → SARIF ─────────────────────────────────────────────
  shellcheck:
    name: ShellCheck (SARIF)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install shellcheck + jq
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: Run shellcheck and emit SARIF
        run: |
          set -euo pipefail
          files=$(git ls-files '*.sh' 'bin/langdev-sync' 'test/helpers/bin/*' 'test/helpers/common.bash')
          # json1 → SARIF 2.1.0. `|| true`: a finding is a non-zero exit, but
          # we still want to publish the report rather than abort here.
          echo "$files" | xargs shellcheck -x -f json1 > sc.json || true
          jq '{
            version: "2.1.0",
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            runs: [{
              tool: { driver: {
                name: "ShellCheck",
                informationUri: "https://www.shellcheck.net",
                rules: []
              }},
              results: [ (.comments // [])[] | {
                ruleId: ("SC" + (.code|tostring)),
                level: (if .level == "error" then "error"
                        elif .level == "warning" then "warning"
                        else "note" end),
                message: { text: .message },
                locations: [{ physicalLocation: {
                  artifactLocation: { uri: .file },
                  region: { startLine: .line, startColumn: .column }
                }}]
              } ]
            }]
          }' sc.json > shellcheck.sarif
      - name: Upload ShellCheck SARIF
        uses: github/codeql-action/upload-sarif@2d92b76c45b91eb80fc44c74ce3fce0ee94e8f9d # v3.30.0
        with:
          sarif_file: shellcheck.sarif
          category: shellcheck

  # ── Trivy config (Dockerfile / IaC misconfig) → SARIF ──────────────
  trivy-config:
    name: Trivy config (SARIF)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Trivy
        run: |
          sudo apt-get update && sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy
      - name: Trivy misconfiguration scan
        run: |
          trivy config . --format sarif --output trivy-config.sarif --exit-code 0 || true
          if [ ! -s trivy-config.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[]}' > trivy-config.sarif
          fi
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@2d92b76c45b91eb80fc44c74ce3fce0ee94e8f9d # v3.30.0
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  # ── Checkov (Dockerfile + secrets policy) → SARIF ──────────────────
  checkov:
    name: Checkov (SARIF)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Checkov
        run: pip3 install --no-cache-dir checkov
      - name: Checkov scan
        run: |
          checkov -d . --framework dockerfile,secrets --output sarif --output-file-path . --soft-fail || true
          if [ ! -f results.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[]}' > results.sarif
          fi
      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@2d92b76c45b91eb80fc44c74ce3fce0ee94e8f9d # v3.30.0
        with:
          sarif_file: results.sarif
          category: checkov
