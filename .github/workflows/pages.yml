# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Deploy documentation and single-page landing site to GitHub Pages using SSG.
name: pages

on:
  push:
    branches:
      - main
    paths:
      - "content/**"
      - "_layouts/**"
      - "assets/**"
      - "ssg.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@21e8d6411516e885c2c7c5957d34ecfefae14b98 # stable

      - name: Cache SSG binary
        uses: actions/cache@0c45773b623bea8c8e75f6c82b208c3cf94ea4f9 # v4.0.2
        with:
          path: ~/.cargo/bin/ssg
          key: ${{ runner.os }}-ssg-v0.0.57

      - name: Install SSG
        run: |
          if ! command -v ssg >/dev/null 2>&1; then
            cargo install ssg --version 0.0.57 || cargo install ssg
          fi

      - name: Build static site with SSG
        run: |
          mkdir -p public
          ssg build -f ssg.toml || ssg build
          cp -r assets public/ || true

      - name: Setup Pages
        uses: actions/configure-pages@983d7712d7b0e42eaf82c94ff005ab0ce2384bd8 # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: "public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
