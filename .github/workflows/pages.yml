# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Deploy documentation and single-page landing site to GitHub Pages using SSG.
name: pages

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache SSG binary
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cargo/bin/ssg
          key: ${{ runner.os }}-ssg-v0.0.57

      - name: Install SSG
        run: |
          if ! command -v ssg >/dev/null 2>&1; then
            cargo install ssg --version 0.0.57 || cargo install ssg
          fi

      - name: Build static site with SSG
        run: |
          cd website
          ssg build -f ssg.toml || ssg build
          mkdir -p public/assets
          cp -r _layouts/*.css _layouts/*.js _layouts/*.ico public/ 2>/dev/null || true
          cp -r ../assets/* public/assets/ 2>/dev/null || true
          cp -r assets/* public/assets/ 2>/dev/null || true
          cp -f ../assets/logo.svg public/assets/logo.svg 2>/dev/null || true
          cp -f ../assets/logo.svg public/logo.svg 2>/dev/null || true
          cp -f assets/logo.svg public/assets/logo.svg 2>/dev/null || true
          cp -f assets/logo.svg public/logo.svg 2>/dev/null || true
          cp _layouts/favicon.ico public/ 2>/dev/null || true
          cp CNAME public/CNAME 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: "website/public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
