# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Deploy documentation and single-page landing site to GitHub Pages using SSG.
name: pages

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache SSG binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/ssg
          key: ${{ runner.os }}-ssg-v0.0.57

      - name: Install SSG
        run: |
          if ! command -v ssg >/dev/null 2>&1; then
            cargo install ssg --version 0.0.57 || cargo install ssg
          fi

      - name: Build static site with SSG
        run: |
          cd website
          ssg build -f ssg.toml || ssg build
          mkdir -p public/assets
          cp -r _layouts/*.css _layouts/*.js _layouts/*.ico public/ 2>/dev/null || true
          cp -r ../assets/* public/assets/ 2>/dev/null || true
          cp -r assets/* public/assets/ 2>/dev/null || true
          cp -f ../assets/logo.svg public/assets/logo.svg 2>/dev/null || true
          cp -f ../assets/logo.svg public/logo.svg 2>/dev/null || true
          cp -f assets/logo.svg public/assets/logo.svg 2>/dev/null || true
          cp -f assets/logo.svg public/logo.svg 2>/dev/null || true
          cp _layouts/favicon.ico public/ 2>/dev/null || true
          cp CNAME public/CNAME 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "website/public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
