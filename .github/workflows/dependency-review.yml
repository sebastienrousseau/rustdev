# Dependency review (langdev core repo — mirrors templates/github-workflows/dependency-review.yml).
# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Flags dependency changes a pull request introduces — including new or bumped
# GitHub Actions in .github/workflows — and fails on a high-severity advisory
# or a denied licence. Runs on pull_request only (never pull_request_target),
# so it never checks out and runs untrusted PR-head code with write scope.
name: dependency-review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0
