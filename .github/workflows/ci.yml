# langdev CI — lint, test+coverage, build, scan. Copy to .github/workflows/ci.yml.
# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# All actions are pinned to a full 40-char commit SHA (the tag in the trailing
# comment is documentation only). Least-privilege by default: the workflow can
# only read; no job escalates. SARIF upload to code-scanning lives in sast.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint the shell scripts ─────────────────────────────────────────
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck (all shell sources)
        run: |
          set -euo pipefail
          # Every tracked shell script plus the (extensionless) sync tool and
          # the test doubles. bats files use a DSL shellcheck does not model,
          # so they are linted by bats itself in the `coverage` job.
          files=$(git ls-files '*.sh' 'bin/langdev-sync' 'test/helpers/bin/*' 'test/helpers/common.bash')
          echo "$files"
          shellcheck -x $files

  # ── Lint the Containerfile ─────────────────────────────────────────
  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Containerfile

  # ── Unit tests + coverage gate (fail below 95%) ────────────────────
  coverage:
    name: bats + kcov (>=95%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install bats + build kcov from source
        # kcov is not in the ubuntu-24.04 apt repositories, so build it from
        # source. bats itself ships in apt.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bats binutils-dev libcurl4-openssl-dev \
            libdw-dev libiberty-dev zlib1g-dev libssl-dev cmake g++ git
          git clone --depth 1 https://github.com/SimonKagstrom/kcov.git "$RUNNER_TEMP/kcov"
          cmake -S "$RUNNER_TEMP/kcov" -B "$RUNNER_TEMP/kcov/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/kcov/build" -j"$(nproc)"
          sudo cmake --install "$RUNNER_TEMP/kcov/build"
          kcov --version
      - name: Run tests under kcov and enforce the coverage floor
        run: ./test/run.sh
        env:
          COVERAGE_THRESHOLD: "95"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage
          retention-days: 7

  # ── Build the image, scan it, and publish an SBOM ──────────────────
  build-scan:
    name: build + trivy + sbom
    runs-on: ubuntu-latest
    needs: [shellcheck, hadolint, coverage]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0
      - name: Build image (load locally)
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.13.0
        with:
          context: .
          file: Containerfile
          load: true
          tags: ${{ github.event.repository.name }}:ci
      - name: Trivy vulnerability scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: ${{ github.event.repository.name }}:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ github.event.repository.name }}:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30
