# langdev CI — lint, test+coverage, build, scan. Copy to .github/workflows/ci.yml.
# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# All actions are pinned to a full 40-char commit SHA (the tag in the trailing
# comment is documentation only). Least-privilege by default: the workflow can
# only read; no job escalates. SARIF upload to code-scanning lives in sast.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint the shell scripts ─────────────────────────────────────────
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck (all shell sources)
        run: |
          set -euo pipefail
          files=$(git ls-files '*.sh' 'bin/langdev-sync' 'test/helpers/bin/*' 'test/helpers/common.bash')
          for f in $files; do
            if [ -f "$f" ]; then
              shellcheck --shell=bash -x "$f"
            fi
          done

  # ── Lint the Containerfile ─────────────────────────────────────────
  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Containerfile
          config: .hadolint.yaml
          failure-threshold: error

  # ── Unit tests + coverage gate (fail below 95%) ────────────────────
  coverage:
    name: bats + kcov (>=95%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install bats + kcov
        run: |
          sudo apt-get update && sudo apt-get install -y bats libdw1 binutils || true
          KCOV_URL="https://github.com/SimonKagstrom/kcov/releases/download/v42/kcov-amd64.tar.gz"
          if curl -sLf "$KCOV_URL" -o /tmp/kcov.tar.gz; then
            sudo tar xzf /tmp/kcov.tar.gz -C /usr/local/bin || true
          fi
      - name: Run tests under kcov and enforce the coverage floor
        run: ./test/run.sh
        env:
          COVERAGE_THRESHOLD: "95"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage
          retention-days: 7

  # ── Build the image, scan it, and publish an SBOM ──────────────────
  build-scan:
    name: build + trivy + sbom
    runs-on: ubuntu-latest
    needs: [shellcheck, hadolint, coverage]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build image (load locally)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile
          load: true
          tags: ${{ github.event.repository.name }}:ci
      - name: Install Trivy
        run: |
          sudo apt-get update && sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy
      - name: Trivy vulnerability scan (fail on HIGH/CRITICAL)
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 "${{ github.event.repository.name }}:ci"
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ github.event.repository.name }}:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30
