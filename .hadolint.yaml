# hadolint configuration for langdev container suite
# SPDX-License-Identifier: Apache-2.0 OR MIT
failure-threshold: error
ignored:
  - DL3003  # Use WORKDIR to switch directory (we do multi-command builds)
  - DL3008  # Pin versions in apt-get install (rolling base images)
  - DL3013  # Pin versions in pip install
  - DL3018  # Pin versions in apk add
  - DL4006  # Set pipefail option for shell (checked by shellcheck)
  - SC2015  # Note that A && B || C is not if-then-else
