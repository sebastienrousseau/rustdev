<header class="site-header" role="banner">
  <div class="container header-inner">
    <a class="brand" href="#hero" aria-label="{{name}} Home">
      <img src="{{site_path}}assets/logo.svg" alt="{{name}} container environment logo" class="brand-logo" width="32" height="32" />
      <span class="brand-text">{{name}}</span>
    </a>
    <button
      class="nav-toggle"
      id="navToggle"
      type="button"
      aria-expanded="false"
      aria-controls="navMenu"
      aria-label="Toggle navigation menu"
    >
      <span class="visually-hidden">Menu</span>
      <span class="nav-toggle-icon" aria-hidden="true">☰</span>
    </button>
    <nav class="nav-menu" id="navMenu" aria-label="Main Navigation">
      <a class="nav-link" href="#overview">Overview</a>
      <a class="nav-link" href="#features">Features</a>
      <a class="nav-link" href="#ai-ide">AI IDE</a>
      <a class="nav-link" href="#suite">Suite</a>
      <a class="nav-link" href="#security">Security</a>
      <a class="nav-link" href="#faq">FAQ</a>
    </nav>
    <div class="header-actions">
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle light and dark mode theme">
        <span class="theme-icon" aria-hidden="true">◐</span>
      </button>
      <a class="btn btn-outline btn-sm" href="https://github.com/sebastienrousseau/{{name}}" target="_blank" rel="noopener noreferrer" aria-label="View {{name}} on GitHub">GitHub</a>
      <a class="btn btn-primary btn-sm" href="#quickstart">Get Started</a>
    </div>
  </div>
</header>
