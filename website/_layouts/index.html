{{#extends "base"}}
{{#block "main"}}
<section id="hero" class="hero-section">
  <div class="container hero-container text-center">
    <div class="pill-badge">
      <span class="pill-tag">NEW</span>
      <span class="pill-text">v0.0.4 Unified Release · TMUX IDE · MCP Agent · Worktrees</span>
    </div>
    <h1 class="hero-title">{{headline}}</h1>
    <p class="hero-lead">{{lead}}</p>
    <div class="hero-cta-group">
      <a class="btn btn-primary btn-lg" href="#quickstart">Quick Start</a>
      <a class="btn btn-secondary btn-lg" href="https://github.com/sebastienrousseau/{{name}}" target="_blank" rel="noopener">Star on GitHub</a>
    </div>

    <!-- Authentic Code & Terminal IDE Preview -->
    <figure class="terminal-preview-card">
      <figcaption class="terminal-header">
        <div class="window-dots">
          <span class="dot dot-red" aria-hidden="true"></span>
          <span class="dot dot-yellow" aria-hidden="true"></span>
          <span class="dot dot-green" aria-hidden="true"></span>
        </div>
        <div class="terminal-tab-bar">
          <span class="tab-item active-tab font-mono">src/lib.rs</span>
          <span class="tab-item font-mono">terminal</span>
        </div>
        <div class="terminal-actions">
          <span class="badge-status font-mono">● Rust 1.85 Edition 2024</span>
        </div>
      </figcaption>
      <div class="terminal-editor-pane">
        <pre class="editor-code font-mono"><code><span class="code-comment">// src/lib.rs · Rust 1.85 Edition 2024 · Async Stdio Protocol Server</span>
<span class="code-kw">pub async fn</span> <span class="code-fn">process_stream</span>&lt;S&gt;(<span class="code-kw">mut</span> stream: S) -&gt; <span class="code-type">Result</span>&lt;<span class="code-type">Metrics</span>, <span class="code-type">Error</span>&gt;
<span class="code-kw">where</span>
    S: <span class="code-type">Stream</span>&lt;<span class="code-type">Item</span> = <span class="code-type">Event</span>&gt; + <span class="code-type">Unpin</span>,
{
    <span class="code-kw">let mut</span> metrics = <span class="code-type">Metrics</span>::<span class="code-fn">default</span>();
    <span class="code-kw">while let</span> <span class="code-type">Some</span>(event) = stream.<span class="code-fn">next</span>().<span class="code-kw">await</span> {
        metrics.<span class="code-fn">record</span>(event.<span class="code-fn">process</span>().<span class="code-kw">await</span>?);
    }
    <span class="code-type">Ok</span>(metrics)
}</code></pre>
      </div>
      <div class="terminal-cli-pane font-mono">
        <div class="cli-line"><span class="mcp-tl-ps">$ </span>cargo test --all-targets &amp;&amp; cargo clippy -- -D warnings</div>
        <div class="cli-out">   Compiling rustdev-app v0.0.4 (/work) · 12 tests passed in 0.28s</div>
        <div class="cli-line"><span class="mcp-tl-ask">&gt; </span>Claude MCP: Dispatch hermetic tool call in ephemeral worktree</div>
        <div class="cli-out cli-ok">✓ 100% tests passed · 0 clippy warnings · sccache 100% hit rate · 0 vulnerabilities</div>
      </div>
    </figure>
  </div>
</section>

<!-- Content sections rendered from Markdown -->
<div class="content-sections">
  {{!content}}
</div>

{{/block}}
