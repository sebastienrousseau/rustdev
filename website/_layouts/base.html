<!DOCTYPE html>
<html lang="{{language}}" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               base-uri 'self';
               object-src 'none';
               script-src 'self' 'unsafe-inline';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data: https:;
               font-src 'self';
               connect-src 'self';
               manifest-src 'self';"
    />

    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{permalink}}" />
    <meta property="og:image" content="{{site_url}}images/screenshot.png" />
    <meta property="og:image:width" content="1500" />
    <meta property="og:image:height" content="1000" />
    <meta property="og:image:alt" content="{{title}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />
    <meta name="twitter:image" content="{{site_url}}images/screenshot.png" />

    <link rel="canonical" href="{{permalink}}" />
    <link rel="icon" href="{{site_path}}favicon.ico" sizes="any" />
    <link rel="icon" href="{{site_path}}assets/logo.svg" type="image/svg+xml" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#090a0f" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "SoftwareApplication",
          "@id": "{{site_url}}#software",
          "name": "{{name}}",
          "applicationCategory": "DeveloperApplication",
          "operatingSystem": "Linux, macOS, Windows",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          },
          "description": "{{description}}",
          "softwareVersion": "v0.0.4",
          "author": {
            "@type": "Person",
            "name": "{{author}}",
            "url": "{{site_url}}"
          }
        },
        {
          "@type": "WebPage",
          "@id": "{{permalink}}#webpage",
          "url": "{{permalink}}",
          "name": "{{title}}",
          "description": "{{description}}",
          "inLanguage": "{{language}}"
        }
      ]
    }
    </script>

    <style>
:root {
  --bg: #090a0f;
  --bg-subtle: #11141f;
  --bg-card: #151928;
  --bg-card-hover: #1c2236;
  --border: #374151;
  --border-strong: #4b5563;
  --fg: #ffffff;
  --fg-muted: #e5e7eb;
  --fg-subtle: #9ca3af;
  --primary: #60a5fa;
  --primary-hover: #93c5fd;
  --primary-glow: rgba(96, 165, 250, 0.25);
  --accent: #c084fc;
  --success: #34d399;
  --focus: #60a5fa;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 24px;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

[data-theme="light"] {
  --bg: #ffffff;
  --bg-subtle: #f9fafb;
  --bg-card: #f3f4f6;
  --bg-card-hover: #e5e7eb;
  --border: #9ca3af;
  --border-strong: #6b7280;
  --fg: #090a0f;
  --fg-muted: #1f2937;
  --fg-subtle: #374151;
  --primary: #1d4ed8;
  --primary-hover: #1e40af;
  --primary-glow: rgba(29, 78, 216, 0.15);
  --accent: #6b21a8;
  --success: #065f46;
  --focus: #1d4ed8;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-family: var(--font-sans);
  background-color: var(--bg);
  color: var(--fg);
  scroll-behavior: smooth;
  line-height: 1.6;
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.skip-link {
  position: absolute;
  top: -999px;
  left: 1rem;
  background: var(--primary);
  color: #ffffff;
  padding: 0.5rem 1rem;
  border-radius: var(--radius-sm);
  z-index: 100;
  font-weight: 700;
}
.skip-link:focus {
  top: 1rem;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.container {
  width: 100%;
  max-width: 1160px;
  margin: 0 auto;
  padding: 0 1.5rem;
}

.narrow {
  max-width: 760px;
}

.text-center {
  text-align: center;
}

.font-mono {
  font-family: var(--font-mono);
}

/* --- Header & Navigation --- */
.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}

.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 4.5rem;
}

.brand {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  text-decoration: none;
  color: var(--fg);
  font-weight: 700;
  font-size: 1.25rem;
}

.nav-menu {
  display: flex;
  gap: 1.5rem;
}

.nav-link {
  color: var(--fg-muted);
  text-decoration: none;
  font-size: 0.9375rem;
  font-weight: 600;
  padding: 0.5rem 0.25rem;
  transition: color 0.2s;
}

.nav-link:hover,
.nav-link.active {
  color: var(--primary);
  text-decoration: underline;
  text-underline-offset: 4px;
}

.nav-toggle {
  display: none;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--fg);
  padding: 0.5rem 0.75rem;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 1.25rem;
}

@media (max-width: 768px) {
  .nav-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .nav-menu {
    display: none;
    position: absolute;
    top: 4.5rem;
    left: 0;
    right: 0;
    background: var(--bg-card);
    border-bottom: 2px solid var(--border-strong);
    flex-direction: column;
    padding: 1.5rem;
    gap: 1rem;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
  }

  .nav-menu.is-open {
    display: flex;
  }
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.theme-toggle {
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--fg);
  width: 2.5rem;
  height: 2.5rem;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
}

/* --- Buttons --- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  text-decoration: none;
  border-radius: 2rem;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  cursor: pointer;
  border: 1px solid transparent;
  min-height: 44px;
  min-width: 44px;
}

.btn-sm {
  padding: 0.4rem 1.1rem;
  font-size: 0.875rem;
}

.btn-lg {
  padding: 0.8rem 1.85rem;
  font-size: 1rem;
}

.btn-primary {
  background: var(--primary);
  color: #090a0f;
  box-shadow: 0 4px 14px var(--primary-glow);
}

[data-theme="light"] .btn-primary {
  background: var(--primary);
  color: #ffffff;
}

.btn-primary:hover {
  background: var(--primary-hover);
  transform: translateY(-1px);
}

.btn-secondary {
  background: var(--bg-card);
  color: var(--fg);
  border-color: var(--border-strong);
}

.btn-secondary:hover {
  background: var(--bg-card-hover);
  transform: translateY(-1px);
}

.btn-outline {
  background: transparent;
  color: var(--fg);
  border-color: var(--border);
}

.btn-outline:hover {
  background: var(--bg-card);
}

:focus,
:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

.hero-section {
  padding: 5rem 0 3rem;
  position: relative;
  overflow: hidden;
}

.pill-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.3rem 0.8rem 0.3rem 0.4rem;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 2rem;
  margin-bottom: 1.5rem;
}

.pill-tag {
  background: var(--primary);
  color: #090a0f;
  font-size: 0.75rem;
  font-weight: 800;
  padding: 0.15rem 0.5rem;
  border-radius: 1rem;
  text-transform: uppercase;
}

[data-theme="light"] .pill-tag {
  color: #ffffff;
}

.pill-text {
  font-size: 0.875rem;
  color: var(--fg-muted);
  font-weight: 600;
}

.hero-title {
  font-size: clamp(2.5rem, 5vw, 4.2rem);
  font-weight: 800;
  line-height: 1.15;
  letter-spacing: -0.03em;
  margin-bottom: 1.25rem;
  color: var(--fg);
}

.hero-lead {
  font-size: 1.2rem;
  color: var(--fg-muted);
  max-width: 65ch;
  margin: 0 auto 2rem;
  line-height: 1.7;
}

.hero-cta-group {
  display: flex;
  justify-content: center;
  gap: 1rem;
  margin-bottom: 3.5rem;
}

/* --- Realistic Animated Terminal (inspired by iso20022-mcp) --- */
.mcp-term {
  margin: 0 auto;
  max-width: 960px;
  background: #0d1117;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: 0 30px 90px rgba(0, 0, 0, 0.65);
  text-align: left;
}

.mcp-term-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #161b22;
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
}

.mcp-term-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  flex: none;
}
.mcp-term-dot.dot-red { background: #ef4444; }
.mcp-term-dot.dot-yellow { background: #eab308; }
.mcp-term-dot.dot-green { background: #22c55e; }

.mcp-term-title {
  font-family: var(--font-mono);
  font-size: 0.8125rem;
  letter-spacing: 0.04em;
  color: #c9d1d9;
  margin-left: 8px;
  font-weight: 600;
}

.mcp-term-body {
  margin: 0;
  padding: clamp(18px, 2.4vw, 28px);
  overflow-x: auto;
  background: transparent;
  border: 0;
  box-shadow: none;
}

.mcp-term-body code {
  display: block;
  font-family: var(--font-mono);
  font-size: clamp(0.85rem, 1.15vw, 0.95rem);
  line-height: 1.85;
  color: #f0f6fc;
  background: transparent;
  padding: 0;
  white-space: pre;
}

.mcp-tl {
  display: block;
  min-width: 0;
}

.mcp-tl-ps {
  color: #7ee787;
  font-weight: 700;
}

.mcp-tl-ask .mcp-tl-ps {
  color: #79c0ff;
  font-weight: 700;
}

.mcp-tl-out {
  color: #9ea7b3;
}

.mcp-tl-ok {
  color: #7ee787;
  font-weight: 700;
}

.mcp-tl-caret::after {
  content: "\258B";
  color: #79c0ff;
  animation: mcpblink 1.1s step-end infinite;
}

@keyframes mcptype {
  from { width: 0; }
  to { width: var(--tw); }
}

@keyframes mcpfade {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes mcpblink {
  50% { opacity: 0; }
}

.mcp-tl-typed {
  overflow: hidden;
  white-space: nowrap;
  width: var(--tw);
  animation: mcptype var(--td) steps(var(--ts), end) both;
  animation-delay: var(--ta);
}

.mcp-tl-fade {
  animation: mcpfade 0.3s ease both;
  animation-delay: var(--ta);
}

.mcp-tl-t1 { --tw: 10ch; --ts: 10; --td: 0.4s; --ta: 0.2s; }
.mcp-tl-f2 { --ta: 0.8s; }
.mcp-tl-t3 { --tw: 72ch; --ts: 72; --td: 1.8s; --ta: 1.4s; }
.mcp-tl-f4 { --ta: 3.4s; }
.mcp-tl-t5 { --tw: 58ch; --ts: 58; --td: 1.5s; --ta: 4.0s; }
.mcp-tl-f6 { --ta: 5.7s; }
.mcp-tl-f7 { --ta: 6.3s; }

@media (prefers-reduced-motion: reduce) {
  .mcp-tl-typed,
  .mcp-tl-fade {
    animation: none;
    width: auto;
    opacity: 1;
  }
  .mcp-tl-caret::after {
    animation: none;
  }
}

.section {
  padding: 4.5rem 0;
  border-top: 1px solid var(--border);
}

.section-title {
  font-size: 2.25rem;
  font-weight: 800;
  margin-bottom: 1rem;
  letter-spacing: -0.02em;
  color: var(--fg);
}

.section-desc {
  font-size: 1.125rem;
  color: var(--fg-muted);
  max-width: 60ch;
  margin: 0 auto 3rem;
  line-height: 1.7;
}

.grid-2x2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 1.5rem;
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 2rem;
  transition: transform 0.2s, border-color 0.2s;
}

.card:hover {
  border-color: var(--border-strong);
  transform: translateY(-2px);
}

.card h3 {
  font-size: 1.25rem;
  font-weight: 800;
  margin-bottom: 0.75rem;
  color: var(--fg);
}

.card p {
  color: var(--fg-muted);
  font-size: 1rem;
  line-height: 1.65;
}

pre {
  background: #0d0f18;
  border: 1px solid var(--border-strong);
  padding: 1.5rem;
  border-radius: var(--radius-md);
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: 1rem;
  line-height: 1.7;
  margin: 1.5rem 0;
  color: #f9fafb;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
}

pre code {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

.table-responsive {
  overflow-x: auto;
  margin: 2rem 0;
}

table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
}

th, td {
  padding: 1rem 1.25rem;
  border-bottom: 1px solid var(--border);
  font-size: 1rem;
}

th {
  background: var(--bg-card);
  color: var(--fg);
  font-weight: 700;
}

td {
  color: var(--fg-muted);
}

.suite-link {
  color: var(--primary);
  text-decoration: underline;
  text-underline-offset: 3px;
  font-weight: 700;
}
.suite-link:hover {
  color: var(--primary-hover);
}

.faq-stack {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
  margin-top: 2rem;
}

.site-footer {
  border-top: 1px solid var(--border);
  background: var(--bg-subtle);
  padding: 4rem 0 2rem;
  margin-top: auto;
}

.footer-inner {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 2.5rem;
}

.footer-brand {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 0.75rem;
}

.version-tag {
  background: var(--bg-card);
  border: 1px solid var(--border);
  font-size: 0.8125rem;
  font-family: var(--font-mono);
  font-weight: 700;
  padding: 0.2rem 0.6rem;
  border-radius: 1rem;
  color: var(--primary);
}

.footer-desc {
  color: var(--fg-muted);
  font-size: 0.9375rem;
  max-width: 35ch;
  margin-bottom: 0.5rem;
}

.footer-copy {
  color: var(--fg-subtle);
  font-size: 0.875rem;
}

.footer-links {
  display: flex;
  gap: 3rem;
}

.footer-col h4 {
  font-size: 0.875rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--fg-subtle);
  font-weight: 800;
  margin-bottom: 0.75rem;
}

.footer-col a {
  display: block;
  color: var(--fg-muted);
  text-decoration: none;
  font-size: 0.9375rem;
  margin-bottom: 0.5rem;
  transition: color 0.2s;
}

.footer-col a:hover {
  color: var(--primary);
  text-decoration: underline;
}
    </style>
    <!-- Cache-busting token. Hardcoded, so it must be bumped by hand
         whenever styles.css or the scripts below change: the CDN keys
         on this exact query string, and an unchanged token serves the
         previous file however correctly the new one deployed. -->
    <link rel="stylesheet" href="{{site_path}}styles.css?v=0.0.5" />

    <script>
(function () {
  try {
    var stored = localStorage.getItem("theme");
    var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    var theme = stored ? stored : (prefersDark ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
    document.documentElement.classList.remove("no-js");
  } catch (e) {}
})();
    </script>
    <script src="{{site_path}}theme-init.js?v=0.0.5"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    {{> header}}
    <main id="main" role="main">
      {{#block "main"}}{{/block}}
    </main>
    {{> footer}}
    <script src="{{site_path}}main.js?v=0.0.5" defer></script>
  </body>
</html>
