# langdev tmux configuration — portable, IDE-like, AI-first.
# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Provides an IDE layout, Vim navigation, cross-platform terminal compatibility,
# and container-branded status bar.

# --- Terminal & Colors --------------------------------------------------------
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc,screen-256color:Tc,alacritty:Tc,tmux-256color:Tc"
set -s escape-time 0
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 3
set -g focus-events on

# --- Prefix Key ---------------------------------------------------------------
# Bind both C-a (ergonomic) and C-b (default)
set -g prefix C-a
bind C-a send-prefix
set -g prefix2 C-b
bind C-b send-prefix2

# --- Mouse Support ------------------------------------------------------------
set -g mouse on

# --- Base Indexing ------------------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Vim Navigation & Pane Selection ------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Prefix + Vim direction keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt/Option + Vim direction keys (no prefix needed)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt/Option + Arrows (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

# Direct numeric pane selection (Prefix + 1..4)
bind 1 select-pane -t 1
bind 2 select-pane -t 2
bind 3 select-pane -t 3
bind 4 select-pane -t 4

# --- Intuitive Window Splits --------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind \ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- Pane Resizing ------------------------------------------------------------
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- IDE Layouts & Shortcuts --------------------------------------------------
# Prefix + i : Instant 4-pane VS Code Grid (Explorer | Editor / Terminal | AI)
bind i run-shell "tmux-ide --layout ide"
# Prefix + I : Minimalist 3-pane Layout (Editor / Terminal | AI)
bind I run-shell "tmux-ide --layout minimalist"
# Prefix + F : Toggle Editor Focus / Maximize
bind F resize-pane -Z
# Prefix + m : Worktree Manager (muxtree)
bind m run-shell "muxtree menu"

# Reload configuration
bind r source-file /etc/tmux.conf \; display-message "tmux configuration reloaded."

# --- Pane Borders & Titles ----------------------------------------------------
set -g pane-border-status top
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=cyan,bold"
set -g pane-border-format " #[bold]#{?pane_active,#[fg=cyan],#[fg=colour244]} #{pane_index}: #{pane_title} "

# --- Container-Branded Status Bar (TokyoNight Palette) ------------------------
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1a1b26,fg=#c0caf5"

# Detect container branding
%hidden BRAND_ICON="#{?#{m:*python*,#{client_session}},🐍 pythondev,#{?#{m:*rust*,#{client_session}},🦀 rustdev,#{?#{m:*go*,#{client_session}},🐹 godev,#{?#{m:*java*,#{client_session}},☕ javadev,#{?#{m:*swift*,#{client_session}},🦅 swiftdev,#{?#{m:*llama*,#{client_session}},🦙 llamadev,⚡ langdev}}}}}"

# Left status: Container brand badge & Session name
set -g status-left-length 40
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] ${BRAND_ICON} #[bg=#24283b,fg=#7aa2f7,bold] #S #[bg=#1a1b26] "

# Windows tabs
setw -g window-status-separator " "
setw -g window-status-format "#[fg=#565f89,bg=#1a1b26] #I: #W "
setw -g window-status-current-format "#[fg=#1a1b26,bg=#bb9af7,bold] #I: #W #[bg=#1a1b26] "

# Right status: Git branch, Memory/Host, Clock
set -g status-right-length 80
set -g status-right "#[fg=#e0af68,bg=#1a1b26]  #(git -C #{pane_current_path} branch --show-current 2>/dev/null || echo 'main') #[fg=#565f89]│ #[fg=#7dcfff]%H:%M #[fg=#565f89]│ #[fg=#9ece6a]dev@container "

# Auto-initialize IDE layout on session creation if enabled
set-hook -g after-new-session "run-shell 'tmux-ide --auto'"
